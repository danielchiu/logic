{% extends "base.html" %}

{% block title %} Login {% endblock %}

{% block content %}
    {% if error %}
        <p class="error">ERROR: {{ error }}</p>
    {% endif %}
    
    <form method=post>
        <div style="margin: 20px 0;">
            <label for="username-input" style="font-size: 18px; display: block; margin-bottom: 8px;">Username:</label>
            <input type=text name="username" id="username-input" autofocus>
        </div>
        <div>
            <input type=submit name="login" value="Login">
        </div>
    </form>
{% endblock %}
