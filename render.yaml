databases:
  - name: logic-db
    plan: free
    databaseName: logic
    user: logic

services:
  - type: web
    name: logic-game
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn logic:application --bind 0.0.0.0:$PORT
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: PYTHON_VERSION
        value: "3.12"
      - key: DATABASE_URL
        fromDatabase:
          name: logic-db
          property: connectionString
